<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed background and a centered mark inside the 80% safe zone, so it also works as a maskable icon. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3A2F66"/>
      <stop offset="0.55" stop-color="#241C44"/>
      <stop offset="1" stop-color="#161129"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E3A0"/>
      <stop offset="0.45" stop-color="#D9B452"/>
      <stop offset="1" stop-color="#8A6D1F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <polygon points="256,82 430,256 256,430 82,256" fill="url(#gold)" stroke="#F7E3A0" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="256,112 400,256 256,400 112,256" fill="#241C44" stroke="#8A6D1F" stroke-width="3"/>
  <!-- 言 drawn as strokes so it renders the same everywhere, with no font dependency. -->
  <g fill="none" stroke="#FFFDF6" stroke-width="14" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M247 164 L265 184"/>
    <path d="M200 206 H312"/>
    <path d="M218 238 H294"/>
    <path d="M218 268 H294"/>
    <rect x="220" y="298" width="72" height="46"/>
  </g>
</svg>
